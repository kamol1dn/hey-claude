# Groups for the auto-generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Milestones
      labels: [milestone]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Other changes
      labels: ["*"]
