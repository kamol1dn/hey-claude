# Copy to config.yaml and edit (or use Settings… in the tray menu, which
# creates it). config.yaml is git-ignored.

app:
  listening: true            # wake word on at start; off = mic closed until you turn it on
  hotkey: ctrl+alt+space     # global push-to-talk, e.g. ctrl+shift+h, win+alt+j, f9; "" = none
  start_with_windows: false  # Startup-folder shortcut (pythonw -m heyclaude, no console)

wake:
  # The "hey claude" model: a path to a .onnx file (relative = inside this
  # folder) or a stock openWakeWord name (hey_jarvis, alexa, hey_mycroft,
  # hey_rhasspy). If the file is missing or won't load, it falls back to the
  # stock hey_jarvis model at threshold 0.5: the log says why and the island
  # shows "hey jarvis". Training one: docs/train-hey-claude.md.
  model: models/hey_claude.onnx
  # How sure the model must be. tools/wake_eval.py measures your samples and
  # a long recording without the wake word, and recommends a value.
  threshold: 0.5
  # Seconds to ignore the wake word after an interaction ends.
  cooldown: 1.0
  # Ignore the wake word while the assistant itself is speaking, and for
  # speaking_tail_s after it stops (echo, audio still in flight). Clicking the
  # island or the hotkey still interrupts it.
  suppress_while_speaking: true
  speaking_tail_s: 0.7

listen:
  device: null            # sounddevice input index or name; null = Windows default mic
  vad_aggressiveness: 2   # 0..3, higher = stricter about what counts as speech
  start_timeout: 5.0      # give up if no speech starts within this many seconds
  end_silence_ms: 700     # this much silence after speech ends the utterance
  max_seconds: 20
  # Hold this key while talking to keep listening through pauses (silence won't
  # end the utterance until you let go). ctrl = either Ctrl; also right ctrl,
  # caps lock, f13... "" = off. Ctrl+C etc. during a hold count as shortcuts.
  hold_key: ctrl
  max_utterance_s: 180    # safety cap once a hold was used

stt:
  # gpu: the GPU by default, picked per request from actual load (see the
  # *_pct keys below); falls back to the CPU when CUDA/cuDNN is missing, the
  # load fails, or a transcription hits a CUDA error (that request is retried
  # on the CPU). cpu: always cpu_model. --gpu / --cpu override this.
  device: gpu
  # large-v3: ~0.5 s per request on an RTX 4060, ~2 GB VRAM in int8_float16.
  # large-v3-turbo is faster still (~1.6 GB download); set it here once you have it.
  gpu_model: large-v3
  gpu_compute_type: int8_float16   # or float16 (more VRAM)
  cpu_model: base.en          # tiny.en / base.en / small.en / small: loaded only when needed
  cpu_compute_type: int8
  cpu_threads: 4
  language: en
  # Per request: use the CPU when the GPU is at least gpu_busy_pct busy (averaged
  # over ~0.5 s) or short of VRAM, unless the CPU is at least cpu_busy_pct busy
  # (then stay on the GPU). Back to the GPU once it's below gpu_resume_pct.
  gpu_busy_pct: 70
  gpu_resume_pct: 60
  cpu_busy_pct: 85
  # Opt-in: never use the GPU while Adobe Premiere Pro is running (an idle
  # Premiere is fine otherwise; the load check above handles a busy one).
  yield_to_premiere: false

fast:
  # auto  = Anthropic SDK if ANTHROPIC_API_KEY is set, otherwise the claude CLI
  # cli   = always the claude CLI (your subscription login)
  # sdk   = always the Anthropic SDK
  backend: auto
  cli_model: haiku
  sdk_model: claude-haiku-5-5
  # Keep one claude CLI process alive between questions (much faster, and it
  # remembers the conversation). It is recycled after this many turns.
  persistent: true
  max_turns: 20
  max_tokens: 300

agent:
  # Tier (b): questions that need your tools ("who messaged me on Telegram",
  # "what's on my calendar") go to ONE warm Claude Code process, started at
  # launch and reused, so there's no start-up delay per question and no pile
  # of throwaway sessions. It sees whatever MCP servers Claude Code itself is
  # configured with (`claude mcp list`), plus your claude.ai connectors
  # (Gmail, Calendar, Drive...) once the CLI is signed in.
  enabled: true
  model: haiku                 # sonnet for harder lookups, at some latency cost
  cwd: null                    # null = this repo folder
  permission_mode: default
  # What it may use without asking; anything else is denied automatically.
  # Add MCP servers by name prefix, e.g. "mcp__telegram" allows all of that
  # server's tools. Leave out tools that send or change things unless you want
  # "send Sam a message saying ..." to just do it.
  # Defaults: built-in read tools plus the READ-ONLY tools of the claude.ai
  # Calendar / Gmail / Drive connectors (names as the signed-in CLI reports
  # them). Nothing here sends, deletes or edits anything.
  allowed_tools:
    - Read
    - Glob
    - Grep
    - WebSearch
    - WebFetch
    - mcp__claude_ai_Google_Calendar__list_calendars
    - mcp__claude_ai_Google_Calendar__list_events
    - mcp__claude_ai_Google_Calendar__search_events
    - mcp__claude_ai_Google_Calendar__get_event
    - mcp__claude_ai_Gmail__search_threads
    - mcp__claude_ai_Gmail__get_thread
    - mcp__claude_ai_Gmail__get_message
    - mcp__claude_ai_Gmail__list_labels
    - mcp__claude_ai_Google_Drive__search_files
    - mcp__claude_ai_Google_Drive__list_recent_files
    - mcp__claude_ai_Google_Drive__get_file_metadata
    - mcp__claude_ai_Google_Drive__read_file_content
  # MCP servers that live in the Claude *desktop app's* config
  # (claude_desktop_config.json) are invisible to the CLI. List names here to
  # copy them into state/agent-mcp.json and pass them with --mcp-config.
  # Caution for telegram: the copy reuses the same TELEGRAM_SESSION as the
  # desktop app's copy, and Telegram delivers updates to only one connection of
  # an authorization (see telegram-mcp-server's README). Reading history works,
  # but give it its own session if the desktop copy must keep live updates.
  import_desktop_mcp: []       # e.g. [telegram]
  mcp_configs: []              # extra --mcp-config files
  max_turns: 30                # recycle the process after this many questions
  timeout: 180                 # seconds to wait for one answer
  filler: "Let me check."      # spoken right away while it looks things up
  extra_args: []

conversation:
  # One conversation shared by the quick model, the tool agent and tasks:
  # whichever answers next is told what the others said, so "what's on my
  # calendar?" -> "and the weather then?" keeps context.
  followup_s: 5                # after an answer, listen this long without the wake word (0 = off)
  max_turns: 8                 # turns of context passed between tiers
  max_tokens: 1500             # ...and at most about this many tokens of it
  idle_reset_s: 600            # start a new conversation after this much silence
  # Save the conversation: turns go to state/conversations/<date>.jsonl
  # (git-ignored) and are picked up again after a restart; the tool agent's
  # Claude Code session is saved and named "hey-claude <date>". Off: nothing
  # is written to disk. "Start fresh" (said out loud) forgets it either way.
  save: false
  task_question_model: haiku   # answers "what did the <name> task change?" (null = your default)
  task_question_timeout: 120

claude:
  # Path to claude.exe. null = look on PATH, then in the Claude desktop
  # app's bundled copy (%LOCALAPPDATA%\Claude-Data\*\claude-code\<ver>\...).
  exe: null

tasks:
  model: null                    # null = your Claude Code default model
  permission_mode: acceptEdits   # acceptEdits | auto | dontAsk | plan | bypassPermissions
  # Tools the headless run may use without asking. Anything else that would
  # need a permission prompt is denied automatically (--permission-prompts none).
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(ls:*)"
  extra_args: []                 # anything else to pass to claude -p
  max_parallel: 3

# Spoken name -> folder. Say "start a task in <name>: <thing>".
# Several spoken names can point at the same folder.
projects:
  hey claude: D:\coding\hey-claude
  telegram server: D:\coding\telegram-mcp-server
  inha app: D:\coding\inha_app
  timetable bot: D:\coding\timetable_bot

tts:
  backend: sapi          # sapi (pyttsx3) | piper | kokoro
  rate: 190              # sapi words per minute
  voice: null            # sapi voice name substring, e.g. "Zira"; null = default
  piper_exe: piper       # piper backend: path to piper.exe
  piper_model: null      # piper backend: path to a .onnx voice
  kokoro_model: null     # kokoro backend: path to kokoro-v1.0.onnx
  kokoro_voices: null    # kokoro backend: path to voices-v1.0.bin
  kokoro_voice: af_heart

island:
  screen: primary        # primary, or a screen index
  top_margin: auto        # px, or auto = centred in a bar docked at the top of the screen (else 8)
