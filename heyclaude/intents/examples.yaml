# Example phrasings for the instant-command classifier (heyclaude/intents/classifier.py).
# The grammar (grammar.py) catches the usual wordings; these teach the second
# layer the looser ones. "none" holds decoys: things that sound like commands
# but are not (questions about volume, songs, screens, timers...). Phrasings
# you teach it by voice ("teach it") go to state/intents_taught.yaml, not here.
#
# Keep the tests' corpus (tests/fixtures/intents_corpus.yaml) out of this file:
# it measures how well these generalise.

