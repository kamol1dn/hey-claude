# M10 phrasing corpus (tests/test_intents.py). Kept apart from the classifier's
# training phrasings (heyclaude/intents/examples.yaml): it measures how well
# the grammar + classifier generalise. Transcripts are written the way Whisper
# writes them (capitals, punctuation, digits, "30%"), slips included.
#
# corpus: [text, intent, slots]   slots are checked when given (a subset)
# near_miss: text that must NOT be an instant command (it goes to Claude)
# Target: >= 95% of the corpus right, 0 near-misses triggered.

